version: '3.8'

services:
  # GitHub Readme Stats 服务
  github-stats:
    image: ghcr.io/fim-sh/github-readme-stats-docker:latest
    container_name: github-stats
    restart: unless-stopped
    ports:
      - "3001:3000"  # 映射到本地 3001 端口
    environment:
      - PAT_1=${GITHUB_TOKEN}  # 你的 GitHub Token
      - CACHE_SECONDS=1800     # 缓存30分钟
    networks:
      - stats-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api?username=test"]
      interval: 30s
      timeout: 10s
      retries: 3

  # GitHub Streak Stats 服务
  streak-stats:
    image: crusaders/github-readme-stats-docker:latest
    container_name: streak-stats
    restart: unless-stopped
    ports:
      - "3002:80"  # 映射到本地 3002 端口
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}  # 你的 GitHub Token
    networks:
      - stats-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 反向代理 (可选 - 统一入口)
  nginx-proxy:
    image: nginx:alpine
    container_name: stats-proxy
    restart: unless-stopped
    ports:
      - "8080:80"  # 统一通过 8080 端口访问
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - stats-network
    depends_on:
      - github-stats
      - streak-stats

networks:
  stats-network:
    driver: bridge
