{% macro icon(name, size=18) -%}
<svg class="ui-icon icon-{{ name }}" data-icon="{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ ui_icons.get(name, ui_icons.repo) | safe }}</svg>
{%- endmacro %}
