[project]
name = "github-clear"
version = "1.0.0"
description = "All-in-one GitHub/Gitee Repository Manager & Profile Beautifier"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "JackFeng", email = "itdocs@163.com"}
]
keywords = ["github", "gitee", "repository", "profile", "readme", "manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/A2Data/github-clear"
Repository = "https://github.com/A2Data/github-clear"
Issues = "https://github.com/A2Data/github-clear/issues"

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
    "PyGithub>=2.1.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.1.0",
    "Pillow>=10.0.0",
]

[project.scripts]
github-clear = "main:app"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
